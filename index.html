<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Watchlist</title>
  <meta name="theme-color" content="#1B4332">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Watchlist">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    window.FB = { initializeApp, getFirestore, doc, setDoc, getDoc, onSnapshot };
    window.dispatchEvent(new Event('firebase-sdk-ready'));
  </script>

  <style>
    :root {
      --bg: #FAF7F2;
      --card: #FFFFFF;
      --green-dark: #1B4332;
      --green-primary: #2D6A4F;
      --green-accent: #40916C;
      --green-light: #D8F3DC;
      --text: #1F2937;
      --muted: #526058;
      --border: #E2DBD0;
      --badge: #EAE5D9;
      --fav-gold: #D4AF37;
      --good-blue: #1D4ED8;
      --radius: 12px;
      --shadow: 0 4px 12px rgba(27, 67, 50, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 90px; }
    header { background: var(--green-dark); color: #FAF7F2; padding: 12px 16px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    .status-pill { font-size: 0.72rem; padding: 3px 8px; border-radius: 12px; background: rgba(255,255,255,0.15); display: flex; align-items: center; gap: 5px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #95D5B2; }
    .status-dot.error { background: #FF6B6B; }

    .nav-scroll { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; background: #FFFFFF; border-bottom: 1px solid var(--border); white-space: nowrap; scrollbar-width: none; }
    .nav-scroll::-webkit-scrollbar { display: none; }
    .nav-tab { background: var(--badge); border: 1px solid transparent; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; color: var(--muted); cursor: pointer; }
    .nav-tab.active { background: var(--green-primary); color: #FFFFFF; }

    .search-box { padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: flex; gap: 6px; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: #FFFFFF; font-size: 0.88rem; color: var(--text); }
    .btn { background: var(--green-primary); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 0.82rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .btn-secondary { background: var(--badge); color: var(--text); }
    .btn-outline { background: transparent; border: 1px solid var(--green-primary); color: var(--green-primary); }

    .catalog-grid { display: flex; flex-direction: column; gap: 12px; padding: 6px 16px; }
    .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 12px; display: flex; gap: 12px; box-shadow: var(--shadow); position: relative; }
    .cover-thumb-wrap { width: 85px; min-width: 85px; height: 128px; border-radius: 8px; overflow: hidden; background: var(--badge); cursor: pointer; }
    .cover-thumb { width: 100%; height: 100%; object-fit: cover; }
    .card-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 0.98rem; font-weight: 700; color: var(--green-dark); line-height: 1.2; }
    .card-meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .card-cast { font-size: 0.75rem; color: var(--muted); margin: 3px 0 2px 0; line-height: 1.3; }
    
    /* Full readable summary on mobile (no 3-line clamp) */
    .card-summary { font-size: 0.8rem; color: var(--text); margin: 6px 0; line-height: 1.4; }

    .badge-bar { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .badge { font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; background: var(--badge); color: var(--text); }
    .badge-green { background: var(--green-light); color: var(--green-dark); }

    .curation-bar { display: flex; gap: 6px; margin: 6px 0; align-items: center; }
    .curate-btn { border: 1px solid var(--border); background: var(--bg); border-radius: 16px; padding: 3px 8px; font-size: 0.72rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
    .curate-btn.active-fav { background: #FFF8E1; border-color: var(--fav-gold); color: #B78103; }
    .curate-btn.active-good { background: #EFF6FF; border-color: var(--good-blue); color: var(--good-blue); }
    .star-rating { display: inline-flex; gap: 2px; margin-left: auto; cursor: pointer; }
    .star { font-size: 1rem; color: #D1D5DB; }
    .star.filled { color: var(--fav-gold); }

    .list-picker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
    .list-chip { background: var(--badge); border: 1px solid transparent; border-radius: 6px; padding: 6px 2px; font-size: 0.68rem; font-weight: 600; text-align: center; cursor: pointer; }
    .list-chip.selected { background: var(--green-primary); color: #FFFFFF; }

    .note-row { margin-top: 6px; display: flex; gap: 6px; }
    .note-input { font-size: 0.78rem; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #FFFFFF; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .modal-img { width: 100%; max-height: 45vh; object-fit: contain; border-radius: 8px; background: #000; }
    .hidden { display: none !important; }

    .dock-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #FFFFFF; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 90; }
    .dock-btn { display: flex; flex-direction: column; align-items: center; font-size: 0.72rem; color: var(--muted); border: none; background: transparent; cursor: pointer; }
    .dock-btn.active { color: var(--green-primary); font-weight: 700; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Our Watchlist</h1>
      <div id="householdDisplay" style="font-size:0.72rem; color:#D8F3DC;">Connecting...</div>
    </div>
    <div class="status-pill">
      <div id="syncDot" class="status-dot"></div>
      <span id="syncText">Saved</span>
    </div>
  </header>

  <div class="nav-scroll" id="navTabsContainer"></div>

  <section class="search-box">
    <div class="input-row">
      <input type="search" id="searchInput" placeholder="Search title, cast, summary...">
      <select id="sortBy" style="width:125px;">
        <option value="default">Default Sort</option>
        <option value="rating_desc">⭐ Top Rated</option>
        <option value="year_desc">Year (Newest)</option>
        <option value="year_asc">Year (Oldest)</option>
        <option value="title_asc">Title (A-Z)</option>
      </select>
    </div>
    <div class="input-row">
      <select id="formatFilter" style="flex:1;">
        <option value="">All Formats</option>
        <option value="Movie">Movies</option>
        <option value="TV">TV Series</option>
      </select>
      <select id="collectionFilter" style="flex:1;">
        <option value="">All Collections</option>
        <option value="favorites">❤️ Favorites</option>
        <option value="good">👍 Good Movies & Shows</option>
        <option value="high_rated">⭐ Rated 4+ Stars</option>
        <option value="startHere">Start-Here Shortlist</option>
        <option value="family">Kids & Family</option>
        <option value="parenting">Parenting Comedies</option>
        <option value="renovation">Home & Renovation</option>
        <option value="2019-2026">2019–2026 Releases</option>
      </select>
    </div>
  </section>

  <main class="catalog-grid" id="catalogFeed"></main>
  <div id="loadMoreContainer" style="padding: 16px; text-align: center;">
    <button class="btn btn-secondary" id="loadMoreBtn" style="width:100%;">Load More</button>
  </div>

  <nav class="dock-nav">
    <button class="dock-btn active" id="dockDiscover"><span>🎬</span>Titles</button>
    <button class="dock-btn" id="dockCategories"><span>🏷️</span>Categories</button>
    <button class="dock-btn" id="dockHousehold"><span>🔑</span>Login / Sync</button>
    <button class="dock-btn" id="dockSettings"><span>⚙️</span>Settings</button>
  </nav>

  <!-- Large Cover Modal -->
  <div id="coverModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h3 id="modalTitle" style="color:var(--green-dark);"></h3>
      <p id="modalYearFormat" style="font-size:0.82rem; color:var(--muted);"></p>
      <div id="modalCast" style="font-size:0.78rem; color:var(--muted);"></div>
      <img id="modalImg" class="modal-img" alt="Enlarged cover">
      <p id="modalSummary" style="font-size:0.82rem; color:var(--text); line-height:1.4;"></p>
      <div id="modalTrailerContainer"></div>
      <button class="btn btn-secondary" id="modalCloseBtn">Close</button>
    </div>
  </div>

  <!-- Manage Categories Modal -->
  <div id="categoriesModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <h3 style="color:var(--green-dark);">Manage List Categories</h3>
      <div id="categoriesList" style="display:flex; flex-direction:column; gap:8px;"></div>
      <div style="border-top:1px solid var(--border); padding-top:10px; margin-top:10px;">
        <h4 style="font-size:0.85rem; margin-bottom:4px;">Create New List Category</h4>
        <div style="display:flex; gap:6px;">
          <input type="text" id="newCategoryInput" placeholder="e.g. Weekend Binge">
          <button class="btn" id="addCategoryBtn">Create</button>
        </div>
      </div>
      <button class="btn btn-secondary" id="closeCategoriesModal">Close</button>
    </div>
  </div>

  <!-- Login / Household Modal -->
  <div id="householdModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <h3 style="color:var(--green-dark);">Household Sync (No Email)</h3>
      <p style="font-size:0.78rem; color:var(--muted);">Set a username & password. Your husband logs in with the exact same credentials to sync.</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <input type="text" id="userHouseholdInput" placeholder="Household Username (e.g. 32birch)">
        <input type="password" id="passHouseholdInput" placeholder="Household Password">
        <button class="btn" id="loginHouseholdBtn" style="width:100%;">Connect & Sync</button>
        <button class="btn btn-secondary hidden" id="logoutBtn" style="width:100%;">Sign Out</button>
      </div>
      <button class="btn btn-secondary" id="closeHouseholdModal">Close</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-backdrop hidden">
    <div class="modal-box">
      <h3>Settings</h3>
      <div>
        <h4 style="font-size:0.85rem;">Cloud Storage (Firebase)</h4>
        <p style="font-size:0.75rem; color:var(--muted); margin-bottom:4px;">Paste your Firebase Config:</p>
        <textarea id="firebaseConfigInput" rows="4" placeholder='{"apiKey": "...", "projectId": "..."}'></textarea>
        <button class="btn" id="saveConfigBtn" style="margin-top:6px; width:100%;">Save Cloud Config</button>
      </div>
      <div style="border-top:1px solid var(--border); padding-top:10px; margin-top:10px;">
        <h4 style="font-size:0.85rem;">Export Backup</h4>
        <button class="btn btn-secondary" id="exportBackupBtn" style="width:100%;">Download JSON Backup</button>
      </div>
      <button class="btn btn-secondary" id="closeSettingsModal" style="margin-top:10px;">Close</button>
    </div>
  </div>

  <script type="module">
    let catalog = [];
    let householdData = {
      lists: {},
      notes: {},
      favorites: {},
      good: {},
      ratings: {},
      categories: [
        { key: 'watchlist', label: 'Watchlist' },
        { key: 'kids', label: 'Kids watchlist' },
        { key: 'later', label: 'See later' },
        { key: 'seen', label: 'Seen' },
        { key: 'again', label: 'See again' },
        { key: 'maybe', label: 'Not sure' },
        { key: 'no', label: 'Pass' }
      ],
      excludedGenres: ["Horror", "War", "Western"]
    };

    let activeHousehold = localStorage.getItem('ow_household_user') || '';
    let currentFilter = 'uncategorized';
    let pageSize = 25;
    let page = 1;
    let db = null;

    // --- 1. LOAD LOCAL DATA IMMEDIATELY ---
    const savedLocal = localStorage.getItem('ow_local_data');
    if (savedLocal) {
      try {
        const parsed = JSON.parse(savedLocal);
        Object.assign(householdData, parsed);
      } catch(e) {}
    }

    // --- 2. FIREBASE REALTIME SYNC ---
    function initFirebase() {
      const cfg = localStorage.getItem('ow_firebase_config');
      if (!cfg || !window.FB) return;
      try {
        const parsed = JSON.parse(cfg);
        const app = window.FB.initializeApp(parsed);
        db = window.FB.getFirestore(app);

        if (activeHousehold) {
          connectToCloudHousehold(activeHousehold);
        }
      } catch(e) { console.error("Firebase init:", e); }
    }
    window.addEventListener('firebase-sdk-ready', initFirebase);

    function connectToCloudHousehold(username) {
      if (!db || !username) return;
      const hhDocRef = window.FB.doc(db, "households", username);
      window.FB.onSnapshot(hhDocRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          if (data.lists) householdData.lists = data.lists;
          if (data.notes) householdData.notes = data.notes;
          if (data.favorites) householdData.favorites = data.favorites;
          if (data.good) householdData.good = data.good;
          if (data.ratings) householdData.ratings = data.ratings;
          if (data.categories) householdData.categories = data.categories;
          localStorage.setItem('ow_local_data', JSON.stringify(householdData));
          renderNavTabs();
          renderFeed();
        }
      });
    }

    async function syncHouseholdChange() {
      localStorage.setItem('ow_local_data', JSON.stringify(householdData));

      if (!db || !activeHousehold) {
        document.getElementById('syncText').textContent = 'Saved';
        document.getElementById('syncDot').classList.remove('error');
        return;
      }
      try {
        const hhDocRef = window.FB.doc(db, "households", activeHousehold);
        await window.FB.setDoc(hhDocRef, householdData, { merge: true });
        document.getElementById('syncText').textContent = 'Synced';
        document.getElementById('syncDot').classList.remove('error');
      } catch(e) {
        document.getElementById('syncText').textContent = 'Saved locally';
      }
    }

    // --- 3. AUTO-COMBINE & DEDUPLICATE (WITH CACHE BUSTER) ---
    async function loadCatalog() {
      catalog = [];
      const catalogFiles = ['catalog.json', 'catalog_2.json'];

      for (const fileName of catalogFiles) {
        try {
          const res = await fetch(`${fileName}?t=${Date.now()}`);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) catalog.push(...data);
          }
        } catch(e) {}
      }

      // Deduplicate by Title + Year AND by ID
      const seenKeys = new Set();
      const seenIds = new Set();
      catalog = catalog.filter(item => {
        if (!item || !item.title) return false;
        const titleKey = `${item.title.trim().toLowerCase()}_${item.year}`;
        if (seenKeys.has(titleKey) || seenIds.has(item.id)) return false;
        seenKeys.add(titleKey);
        seenIds.add(item.id);
        return true;
      });

      document.getElementById('householdDisplay').textContent = activeHousehold ? `Synced: ${activeHousehold}` : 'Saved Locally';
      renderNavTabs();
      renderFeed();
    }

    // --- 4. NAVIGATION TABS ---
    function renderNavTabs() {
      const container = document.getElementById('navTabsContainer');
      const counts = { all: catalog.length, uncategorized: 0, favorites: 0, good: 0 };
      householdData.categories.forEach(c => counts[c.key] = 0);

      catalog.forEach(item => {
        const assigned = householdData.lists[item.id] || 'uncategorized';
        counts[assigned] = (counts[assigned] || 0) + 1;
        if (householdData.favorites[item.id]) counts.favorites++;
        if (householdData.good[item.id]) counts.good++;
      });

      let tabsHtml = `
        <button class="nav-tab ${currentFilter==='uncategorized'?'active':''}" data-list="uncategorized">📥 Inbox (${counts.uncategorized})</button>
        <button class="nav-tab ${currentFilter==='all'?'active':''}" data-list="all">📚 All Titles (${counts.all})</button>
        <button class="nav-tab ${currentFilter==='favorites'?'active':''}" data-list="favorites">❤️ Favorites (${counts.favorites})</button>
        <button class="nav-tab ${currentFilter==='good'?'active':''}" data-list="good">👍 Good (${counts.good})</button>
      `;

      householdData.categories.forEach(c => {
        tabsHtml += `<button class="nav-tab ${currentFilter===c.key?'active':''}" data-list="${c.key}">${c.label} (${counts[c.key]||0})</button>`;
      });

      container.innerHTML = tabsHtml;

      container.querySelectorAll('.nav-tab').forEach(tab => {
        tab.onclick = () => {
          container.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentFilter = tab.getAttribute('data-list');
          page = 1;
          renderFeed();
        };
      });
    }

    // Format 2-4 cast names cleanly
    function formatCast(cast) {
      if (!cast) return '';
      if (Array.isArray(cast)) return cast.slice(0, 4).join(', ');
      return cast.split(',').map(s => s.trim()).filter(Boolean).slice(0, 4).join(', ');
    }

    // --- 5. RENDER FEED ---
    function renderFeed() {
      const container = document.getElementById('catalogFeed');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const format = document.getElementById('formatFilter').value;
      const coll = document.getElementById('collectionFilter').value;
      const sort = document.getElementById('sortBy').value;

      let filtered = catalog.filter(item => {
        const assigned = householdData.lists[item.id] || 'uncategorized';

        if (currentFilter === 'uncategorized') {
          if (assigned !== 'uncategorized') return false;
        } else if (currentFilter === 'favorites') {
          if (!householdData.favorites[item.id]) return false;
        } else if (currentFilter === 'good') {
          if (!householdData.good[item.id]) return false;
        } else if (currentFilter !== 'all') {
          if (assigned !== currentFilter) return false;
        }

        if (format && item.format !== format) return false;

        if (coll === 'favorites' && !householdData.favorites[item.id]) return false;
        if (coll === 'good' && !householdData.good[item.id]) return false;
        if (coll === 'high_rated' && (householdData.ratings[item.id] || 0) < 4) return false;
        if (coll === 'startHere' && !item.shortlist) return false;
        if (coll === 'family' && item.audience !== 'Family') return false;
        if (coll === 'parenting' && !item.parentingComedy) return false;
        if (coll === 'renovation' && !item.renovation) return false;
        if (coll === '2019-2026' && !(item.year >= 2019 && item.year <= 2026)) return false;

        if (search) {
          const target = `${item.title} ${item.cast||''} ${item.summary||''}`.toLowerCase();
          if (!target.includes(search)) return false;
        }
        return true;
      });

      if (sort === 'year_desc') filtered.sort((a,b) => b.year - a.year);
      else if (sort === 'year_asc') filtered.sort((a,b) => a.year - b.year);
      else if (sort === 'title_asc') filtered.sort((a,b) => a.title.localeCompare(b.title));
      else if (sort === 'rating_desc') filtered.sort((a,b) => (householdData.ratings[b.id]||0) - (householdData.ratings[a.id]||0));

      const displayItems = filtered.slice(0, page * pageSize);
      container.innerHTML = displayItems.map(item => createCardHTML(item)).join('');
      document.getElementById('loadMoreContainer').style.display = displayItems.length < filtered.length ? 'block' : 'none';
    }

    function createCardHTML(item) {
      const assigned = householdData.lists[item.id] || 'uncategorized';
      const isFav = !!householdData.favorites[item.id];
      const isGood = !!householdData.good[item.id];
      const rating = householdData.ratings[item.id] || 0;
      const note = householdData.notes[item.id] || '';
      const castText = formatCast(item.cast);

      const chips = householdData.categories.map(c => `
        <button class="list-chip ${assigned === c.key ? 'selected' : ''}" onclick="window.setList(${item.id}, '${c.key}')">${c.label}</button>
      `).join('');

      let stars = '';
      for (let i = 1; i <= 5; i++) {
        stars += `<span class="star ${i <= rating ? 'filled' : ''}" onclick="window.setRating(${item.id}, ${i === rating ? 0 : i})">★</span>`;
      }

      return `
        <article class="card">
          <div class="cover-thumb-wrap" onclick="window.openModal(${item.id})">
            <img class="cover-thumb" src="${item.cover_url||''}" alt="${item.title}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2285%22 height=%22128%22><rect fill=%22%23eee%22 width=%22100%25%22 height=%22100%25%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2210%22 fill=%22%23888%22>No Cover</text></svg>'">
          </div>
          <div class="card-body">
            <div>
              <h2 class="card-title">${item.title}</h2>
              <div class="card-meta">${item.year} • ${item.format} • ${item.platform || ''}</div>
              
              <!-- 2 to 4 Cast / Host names -->
              ${castText ? `<div class="card-cast">👥 <strong>Cast:</strong> ${castText}</div>` : ''}

              <div class="badge-bar">
                <span class="badge">${item.audience||'General'}</span>
                ${(item.genres||[]).map(g => `<span class="badge">${g}</span>`).join('')}
              </div>

              <!-- Full readable plot summary -->
              <p class="card-summary">${item.summary||''}</p>
            </div>

            <div class="curation-bar">
              <button class="curate-btn ${isFav ? 'active-fav' : ''}" onclick="window.toggleFavorite(${item.id})">❤️ Fav</button>
              <button class="curate-btn ${isGood ? 'active-good' : ''}" onclick="window.toggleGood(${item.id})">👍 Good</button>
              <div class="star-rating">${stars}</div>
            </div>

            <div>
              <div class="list-picker-grid">
                ${chips}
                <button class="list-chip ${assigned === 'uncategorized' ? 'selected' : ''}" onclick="window.setList(${item.id}, 'uncategorized')">Reset</button>
              </div>
              <div class="note-row">
                <input class="note-input" type="text" placeholder="Add note..." value="${note}" onchange="window.saveNote(${item.id}, this.value)">
              </div>
            </div>
          </div>
        </article>
      `;
    }

    // --- 6. ACTIONS ---
    window.setList = function(id, key) {
      if (key === 'uncategorized') delete householdData.lists[id];
      else householdData.lists[id] = key;
      syncHouseholdChange();
      renderNavTabs();
      renderFeed();
    };

    window.toggleFavorite = function(id) {
      householdData.favorites[id] = !householdData.favorites[id];
      syncHouseholdChange();
      renderNavTabs();
      renderFeed();
    };

    window.toggleGood = function(id) {
      householdData.good[id] = !householdData.good[id];
      syncHouseholdChange();
      renderNavTabs();
      renderFeed();
    };

    window.setRating = function(id, val) {
      householdData.ratings[id] = val;
      syncHouseholdChange();
      renderNavTabs();
      renderFeed();
    };

    window.saveNote = function(id, text) {
      householdData.notes[id] = text.trim();
      syncHouseholdChange();
    };

    // --- 7. MODALS ---
    window.openModal = function(id) {
      const item = catalog.find(x => x.id === id);
      if (!item) return;
      document.getElementById('modalTitle').textContent = item.title;
      document.getElementById('modalYearFormat').textContent = `${item.year} • ${item.format} • ${item.platform||''}`;
      
      const castText = formatCast(item.cast);
      document.getElementById('modalCast').innerHTML = castText ? `👥 <strong>Cast:</strong> ${castText}` : '';
      document.getElementById('modalSummary').textContent = item.summary || '';
      document.getElementById('modalImg').src = item.cover_url || '';
      document.getElementById('coverModal').classList.remove('hidden');
    };
    document.getElementById('modalCloseBtn').onclick = () => document.getElementById('coverModal').classList.add('hidden');

    document.getElementById('searchInput').oninput = () => { page = 1; renderFeed(); };
    document.getElementById('sortBy').onchange = () => { page = 1; renderFeed(); };
    document.getElementById('formatFilter').onchange = () => { page = 1; renderFeed(); };
    document.getElementById('collectionFilter').onchange = () => { page = 1; renderFeed(); };
    document.getElementById('loadMoreBtn').onclick = () => { page++; renderFeed(); };

    // Dock listeners
    document.getElementById('dockDiscover').onclick = hideAllModals;
    document.getElementById('dockCategories').onclick = () => { hideAllModals(); renderCategoriesManager(); document.getElementById('categoriesModal').classList.remove('hidden'); };
    document.getElementById('dockHousehold').onclick = () => { hideAllModals(); document.getElementById('householdModal').classList.remove('hidden'); };
    document.getElementById('dockSettings').onclick = () => { hideAllModals(); document.getElementById('settingsModal').classList.remove('hidden'); };

    function hideAllModals() {
      ['coverModal', 'categoriesModal', 'householdModal', 'settingsModal'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
    }
    document.getElementById('closeCategoriesModal').onclick = hideAllModals;
    document.getElementById('closeHouseholdModal').onclick = hideAllModals;
    document.getElementById('closeSettingsModal').onclick = hideAllModals;

    // Categories Manager
    function renderCategoriesManager() {
      const box = document.getElementById('categoriesList');
      box.innerHTML = householdData.categories.map((c, i) => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:#FAF7F2; padding:6px 10px; border-radius:6px;">
          <span>${c.label}</span>
          <button onclick="window.deleteCategory(${i})" style="border:none; background:transparent; color:#c00; font-weight:bold; cursor:pointer;">Delete</button>
        </div>
      `).join('');
    }
    window.deleteCategory = function(index) {
      if (confirm(`Delete "${householdData.categories[index].label}"?`)) {
        householdData.categories.splice(index, 1);
        syncHouseholdChange();
        renderCategoriesManager();
        renderNavTabs();
        renderFeed();
      }
    };
    document.getElementById('addCategoryBtn').onclick = () => {
      const label = document.getElementById('newCategoryInput').value.trim();
      if (!label) return;
      const key = label.toLowerCase().replace(/[^a-z0-9]/g, '_');
      householdData.categories.push({ key, label });
      document.getElementById('newCategoryInput').value = '';
      syncHouseholdChange();
      renderCategoriesManager();
      renderNavTabs();
      renderFeed();
    };

    // Household Login (Username & Password)
    document.getElementById('loginHouseholdBtn').onclick = () => {
      const u = document.getElementById('userHouseholdInput').value.trim();
      const p = document.getElementById('passHouseholdInput').value.trim();
      if (!u) return;
      activeHousehold = u;
      localStorage.setItem('ow_household_user', u);
      localStorage.setItem('ow_household_pass', p);
      if (db) connectToCloudHousehold(u);
      document.getElementById('householdDisplay').textContent = `Synced: ${u}`;
      hideAllModals();
      syncHouseholdChange();
    };

    // Config Save
    document.getElementById('saveConfigBtn').onclick = () => {
      const raw = document.getElementById('firebaseConfigInput').value.trim();
      try {
        JSON.parse(raw);
        localStorage.setItem('ow_firebase_config', raw);
        alert("Config saved! Reloading...");
        window.location.reload();
      } catch(e) { alert("Invalid JSON format"); }
    };

    // Backup Download
    document.getElementById('exportBackupBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(householdData, null, 2)], { type: "application/json" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `watchlist_backup_${Date.now()}.json`;
      a.click();
    };

    // Boot
    initFirebase();
    loadCatalog();
  </script>
</body>
</html>
